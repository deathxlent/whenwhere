<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExtractEvent - 历史事件提取工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📜 ExtractEvent</h1>
      <p class="subtitle">从 HTML 历史文档中提取事件，生成 adddatatools 导入格式 JSON</p>
    </header>

    <div id="config-status" class="status-card">
      <span class="status-indicator status-loading"></span>
      <span class="status-text">正在检查配置...</span>
    </div>

    <div class="main-content">
      <div class="panel">
        <h2>📁 上传文件</h2>
        <div class="upload-area" id="upload-area">
          <input type="file" id="file-input" multiple accept=".html,.htm" hidden>
          <div class="upload-icon">⬆️</div>
          <p>拖拽 HTML 文件到此处，或点击选择文件</p>
          <p class="hint">支持多个文件同时上传</p>
        </div>
        <div id="file-list" class="file-list"></div>
      </div>

      <div class="panel">
        <h2>⚙️ 提取配置</h2>
        <div class="form-group">
          <label for="category-code">分类编码</label>
          <input type="text" id="category-code" placeholder="history" value="history">
        </div>
        <div class="form-group">
          <label for="category-name">分类名称</label>
          <input type="text" id="category-name" placeholder="历史" value="历史">
        </div>
        <div class="form-group">
          <label for="sub-category-code">子分类编码</label>
          <input type="text" id="sub-category-code" placeholder="events" value="events">
        </div>
        <div class="form-group">
          <label for="sub-category-name">子分类名称</label>
          <input type="text" id="sub-category-name" placeholder="历史事件" value="历史事件">
        </div>
        <div class="form-group">
          <label for="additional-instructions">附加说明（可选）</label>
          <textarea id="additional-instructions" rows="3" placeholder="例如：重点关注战争事件、人物生卒年等"></textarea>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button id="btn-preview" class="btn btn-secondary" disabled>预览提取</button>
      <button id="btn-extract" class="btn btn-primary" disabled>开始提取</button>
      <button id="btn-download" class="btn btn-success" disabled>下载 JSON</button>
    </div>

    <div id="result-section" class="result-section hidden">
      <div class="result-header">
        <h2>📊 提取结果</h2>
        <span id="result-count" class="result-count"></span>
      </div>
      <div id="result-table" class="result-table">
        <table>
          <thead>
            <tr>
              <th>序号</th>
              <th>标题</th>
              <th>开始时间</th>
              <th>结束时间</th>
              <th>地点</th>
            </tr>
          </thead>
          <tbody id="result-tbody">
          </tbody>
        </table>
      </div>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="loading-spinner"></div>
      <p id="loading-text">正在提取事件...</p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
